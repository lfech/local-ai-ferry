# Settings for this project. Entries here override the packaged defaults.
# See docs/configuration.md for precedence and restart behavior.

[launcher]
# Blank selects the unversioned deployment.
version =
# Blank selects models.ini. Relative paths are checked here, then in the package.
models_file =
# Seconds to wait for Compose health checks and model imports.
wait_timeout = 300

[images]
# Base images and bundled Ollama recipes used by build and upgrade.
# Pin external images by tag or digest for repeatability.
# Sizes are approximate local Linux amd64 image sizes after loaf build.

# Ollama 0.40.18 for CPU, 193 MB. Serve with --cpu.
# ollama_image = loaf-ollama-cpu
# Full Ollama runtime, 5.1 GB.
# ollama_image = ollama/ollama:latest
# Ollama 0.40.18 for NVIDIA CUDA 13, 1.34 GB.
ollama_image = loaf-ollama-cuda13

# Full Open WebUI, 4.6 GB.
# webui_image = ghcr.io/open-webui/open-webui:main
# Open WebUI with SQLite and chat, 610 MB.
webui_image = ghcr.io/open-webui/open-webui:v0.13.4-slim

# Open Terminal with the bundled build tools, 770 MB.
terminal_server_image = ghcr.io/open-webui/open-terminal:0.17.20-slim

[ollama]
# Default number of context tokens for the two GPU serving profiles.
context_length = 16384
# Seconds to wait for the Ollama API before starting imports.
startup_timeout = 60
# Blank leaves GPU visibility unchanged. Use comma-separated NVIDIA GPU IDs or UUIDs.
cuda_visible_devices =

[webui]
# Host-side IP and port. The loopback address is for local access.
bind_address = 127.0.0.1
port = 3000
# Require sign-in. Set false for a fresh, private WebUI instance.
auth = true

[online]
# Allow Ollama cloud features in the online serving profile.
ollama_cloud = true
# Allow WebUI automatic downloads and update checks in the online profile.
webui_downloads = true

[transfer]
# Directory for new backups and automatic restore selection.
backup_dir = backup
# Refresh cached Modelfiles during backup or import them after restoring.
export_models = false
import_models = false
# Gzip level 4 balances archive size and compression time. Valid levels are 0–9.
compression_level = 4

[terminal_server]
enabled = true
# Include terminal workspace volumes and the bearer key in full backups.
include_in_backup = false
# Relative to the project directory. The file contains a single bearer key.
secret_file = config/terminal-server.key
# Optional .list or .sources file for terminal builds and chat package installs.
apt_source_file =
# Optional local repository directory for file:/run/loaf-apt/repository sources.
apt_repository_dir =
cpus = 2
memory_mib = 2048
max_workspaces = 4
idle_seconds = 900
command_seconds = 900
# A quota-capable volume driver can enforce a hard limit on each workspace.
volume_driver = local
volume_options = {}

[tests]
# The CPU and GPU model workflows also require run_docker_tests.
run_docker_tests = false
run_gpu_tests = false
run_cpu_tests = false
run_catalog_tests = false
run_terminal_server_tests = false
# Test-only override for Docker Engine 26 and 27. The default tests production isolation.
allow_legacy_terminal_bridge = false
