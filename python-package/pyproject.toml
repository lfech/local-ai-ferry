# pyproject.toml - Installable launcher and its deployment data.
# Editable installation keeps the command linked to python-package/src/loaf.

# --- Standard PEP 517/660 build backend (build-time dependency only) ---
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# --- Distribution metadata and command registration ---
[project]
name = "local-ai-ferry"
version = "0.4.0"
description = "Local AI Ferry prepares, transfers and runs offline Ollama and Open WebUI deployments"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "THIRD_PARTY_NOTICES.txt"]
dependencies = []

[project.urls]
Repository = "https://github.com/lfech/local-ai-ferry"
Issues = "https://github.com/lfech/local-ai-ferry/issues"

[project.scripts]
loaf = "loaf.cli:main"

# --- Include the launcher and its deployment tree in the wheel ---
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
loaf = [
    "data/compose.yml",
    "data/compose.cpu.yml",
    "data/compose.terminal-apt.yml",
    "data/compose.terminal-webui.yml",
    "data/config/*.ini",
    "data/docker/*/Dockerfile",
    "data/docker/*/.dockerignore",
    "data/docker/*/*.sh",
    "data/docker/terminal-server/*.py",
    "data/docker/open-webui/*.py",
    "data/docker/terminal-server/*.list",
    # Links to the repository's README.md, docs/ and config/model-examples/ in a checkout; the built package
    # holds the files.
    "data/config/model-examples/*.ini",
    "data/README.md",
    "data/docs/*.md",
    "data/docs/instructions/architecture.md",
    "data/docs/examples/*",
]

[tool.setuptools.exclude-package-data]
loaf = ["data/docs/*-record.md"]
