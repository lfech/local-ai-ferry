# compose.yml - Model downloads and connected/offline inference on one store.
# loaf stops other profiles before switching services that share the volumes.
# loaf supplies settings from config.ini. Direct Compose calls use the fallbacks.
name: loaf

x-ollama-gpu: &ollama-gpu
  scale: 1
  image: loaf/ollama-offline:${LOAF_NAMESPACE:-latest}
  pull_policy: never
  volumes:
    - ollama:/ollama
  environment: &ollama-settings
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-${LOAF_INI_CONTEXT_LENGTH:-16384}}
    OLLAMA_STARTUP_TIMEOUT: ${OLLAMA_STARTUP_TIMEOUT:-${LOAF_INI_STARTUP_TIMEOUT:-60}}
    CUDA_VISIBLE_DEVICES:
  # The NVIDIA driver and runtime belong on the Docker host.
  gpus: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  healthcheck:
    test: [CMD-SHELL, "test -f /tmp/ollama-imports-complete && OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 12
    # The startup wrapper imports the entire catalog before reporting ready.
    start_period: 10m
  stop_grace_period: 30s
  restart: unless-stopped

x-webui: &webui
  scale: 1
  image: loaf/open-webui:${LOAF_NAMESPACE:-latest}
  pull_policy: never
  volumes:
    - open-webui:/app/backend/data
  environment: &webui-settings
    OLLAMA_BASE_URL: http://ollama-offline:11434
    WEBUI_AUTH: "${LOAF_WEBUI_AUTH:-true}"
    # Keep the session signing key with the accounts, so that sign-ins survive new containers and profile
    # switches and move with the webui backup type. Open WebUI's start.sh creates the file when it is missing.
    WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
  ports:
    - target: 8080
      published: "${LOAF_WEBUI_PORT:-3000}"
      host_ip: "${LOAF_WEBUI_BIND_ADDRESS:-127.0.0.1}"
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 2m
  restart: unless-stopped

services:
  ollama-online:
    scale: 1
    profiles: [download]
    image: loaf/ollama-online:${LOAF_NAMESPACE:-latest}
    # Consume the locally built image; pulling base images is an explicit build.
    pull_policy: never
    build:
      # Keep each Dockerfile inside its context: Compose grants Buildx read access to contexts.
      context: ${LOAF_DOCKER_DIR:-./docker}/ollama
      target: ollama-online
      args: &ollama-build-args
        OLLAMA_IMAGE: ${OLLAMA_IMAGE:-${LOAF_INI_OLLAMA_IMAGE:-loaf-ollama-cuda13}}
        OLLAMA_SOURCE:
    volumes:
      - ollama:/ollama
    # Has Internet access for manual `ollama pull` commands.
    networks: [download]
    healthcheck:
      # A client connects to loopback, although the server binds to 0.0.0.0.
      test: [CMD-SHELL, "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    # A prepared downloader must not restart automatically on the offline host.
    restart: "no"

  ollama-offline:
    <<: *ollama-gpu
    profiles: [offline]
    build:
      context: ${LOAF_DOCKER_DIR:-./docker}/ollama
      target: ollama-offline
      args: *ollama-build-args
    networks: [inference]

  open-webui:
    <<: *webui
    profiles: [offline]
    build:
      context: ${LOAF_DOCKER_DIR:-./docker}/open-webui
      args:
        OPEN_WEBUI_IMAGE: ${OPEN_WEBUI_IMAGE:-${LOAF_INI_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.13.4-slim}}
    depends_on:
      ollama-offline:
        condition: service_healthy
    # Publish the browser port through the web bridge.
    networks: [inference, web, terminal-control]

  ollama-connected:
    <<: *ollama-gpu
    profiles: [online]
    environment:
      <<: *ollama-settings
      OLLAMA_NO_CLOUD: "${LOAF_ONLINE_NO_CLOUD:-false}"
    networks:
      connected:
        # Reuse the same URL even if an existing WebUI database saved it.
        aliases: [ollama-offline]

  open-webui-online:
    <<: *webui
    profiles: [online]
    depends_on:
      ollama-connected:
        condition: service_healthy
    environment:
      <<: *webui-settings
      OFFLINE_MODE: "${LOAF_ONLINE_OFFLINE_MODE:-false}"
      HF_HUB_OFFLINE: "${LOAF_ONLINE_HF_HUB_OFFLINE:-0}"
    networks: [connected, terminal-control]

  terminal-server:
    scale: 1
    profiles: [terminal]
    image: loaf/open-terminal:${LOAF_NAMESPACE:-latest}
    pull_policy: never
    build:
      context: ${LOAF_DOCKER_DIR:-./docker}/terminal-server
      args:
        OPEN_TERMINAL_IMAGE: ${LOAF_TERMINAL_BASE_IMAGE:-ghcr.io/open-webui/open-terminal:0.17.20-slim}
        # loaf build --with-apt-repos sets these; otherwise the build uses the base image's APT sources.
        TERMINAL_APT_SOURCE_FORMAT: ${LOAF_TERMINAL_BUILD_APT_SOURCE_FORMAT:-}
        TERMINAL_APT_SOURCE_HASH: ${LOAF_TERMINAL_BUILD_APT_SOURCE_HASH:-}
        TERMINAL_APT_REPOSITORY_SOURCE_HASH: ${LOAF_TERMINAL_BUILD_APT_REPOSITORY_SOURCE_HASH:-}
      # The build mounts it at the path of chat containers' repository; unused without --with-apt-repos.
      additional_contexts:
        apt-repository: ${LOAF_TERMINAL_BUILD_APT_REPOSITORY_DIR:-${LOAF_DOCKER_DIR:-./docker}/terminal-server}
      secrets: [terminal-apt-source, terminal-apt-repository-source]
    entrypoint: ["/usr/bin/python3", "/opt/loaf-terminal/provisioner.py"]
    command: []
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # A bind-mounted secret keeps the project user's owner-only permissions.
    cap_add: [DAC_OVERRIDE]
    sysctls:
      net.ipv4.ip_forward: "0"
    environment:
      LOAF_TERMINAL_CPUS: ${LOAF_TERMINAL_CPUS:-2}
      LOAF_TERMINAL_MEMORY_MIB: ${LOAF_TERMINAL_MEMORY_MIB:-2048}
      LOAF_TERMINAL_MAX_WORKSPACES: ${LOAF_TERMINAL_MAX_WORKSPACES:-4}
      LOAF_TERMINAL_IDLE_SECONDS: ${LOAF_TERMINAL_IDLE_SECONDS:-900}
      LOAF_TERMINAL_COMMAND_SECONDS: ${LOAF_TERMINAL_COMMAND_SECONDS:-900}
      LOAF_TERMINAL_COMMAND_WAIT_SECONDS: ${LOAF_TERMINAL_COMMAND_WAIT_SECONDS:-120}
      LOAF_TERMINAL_VOLUME_DRIVER: ${LOAF_TERMINAL_VOLUME_DRIVER:-local}
      LOAF_TERMINAL_VOLUME_OPTIONS: ${LOAF_TERMINAL_VOLUME_OPTIONS:-}
      LOAF_TERMINAL_NETWORK: ${LOAF_TERMINAL_NETWORK:-internet}
      # [terminal_server] apt_repository_dir, which the provisioner mounts read-only in chat containers.
      LOAF_TERMINAL_APT_REPOSITORY_DIR: ${LOAF_TERMINAL_APT_REPOSITORY_DIR:-}
    secrets: [terminal-server-key]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - open-webui:/var/lib/loaf-webui:ro
    networks: [terminal-control]
    healthcheck:
      test: [CMD, curl, --noproxy, "*", -fsS, http://terminal-server:8000/health]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 45s
    # Like Ollama and Open WebUI, come back when Docker restarts unless loaf stopped the service.
    restart: unless-stopped

secrets:
  terminal-server-key:
    file: ${LOAF_TERMINAL_SECRET_FILE:-./config/terminal-server.key}
  # The text of apt_source_file for loaf build --with-apt-repos. Buildx reads no file outside the build context.
  terminal-apt-source:
    environment: LOAF_TERMINAL_BUILD_APT_SOURCE
  # The source that the launcher writes for apt_repository_dir, for the same builds.
  terminal-apt-repository-source:
    environment: LOAF_TERMINAL_BUILD_APT_REPOSITORY_SOURCE

# --- Durable data: these literal names are also used by backup/restore commands ---
volumes:
  ollama:
    # The deployment namespace, loaf or loaf-NAME, starts each literal name.
    name: "loaf${LOAF_NAMESPACE:+-}${LOAF_NAMESPACE:-}-ollama"
  open-webui:
    name: "loaf${LOAF_NAMESPACE:+-}${LOAF_NAMESPACE:-}-open-webui"

# --- Routing: downloader access and browser publishing are separate from Ollama ---
networks:
  download: {}
  connected: {}
  web: {}
  terminal-control:
    internal: true
  inference:
    # Local container communication, with no external network route.
    internal: true
