services:
  terminal-server:
    entrypoint: ["/usr/bin/python3", "/run/loaf-terminal/provisioner.py"]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,mode=1777,size=32m"
    environment:
      LOAF_TERMINAL_RUNTIME_APT_SOURCE_FORMAT: ${LOAF_TERMINAL_APT_SOURCE_FORMAT:?}
      LOAF_TERMINAL_APT_REPOSITORY_DIR: ${LOAF_TERMINAL_APT_REPOSITORY_DIR:-}
    labels:
      loaf.terminal.runtime-apt-source: ${LOAF_TERMINAL_APT_SOURCE_HASH:?}
    volumes:
      - type: bind
        source: ${LOAF_TERMINAL_APT_SOURCE_FILE:?}
        target: /etc/apt/sources.list.d/loaf-terminal.${LOAF_TERMINAL_APT_SOURCE_FORMAT:?}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOAF_TERMINAL_RUNTIME_DIR:?}/provisioner.py
        target: /run/loaf-terminal/provisioner.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOAF_TERMINAL_RUNTIME_DIR:?}/runner.py
        target: /run/loaf-terminal/runner.py
        read_only: true
        bind:
          create_host_path: false
      # Chat containers hide the image's own APT sources behind this empty one.
      - type: bind
        source: ${LOAF_TERMINAL_RUNTIME_DIR:?}/no-apt-source.list
        target: /run/loaf-terminal/no-apt-source.list
        read_only: true
        bind:
          create_host_path: false
