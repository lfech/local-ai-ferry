name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build and check release assets
        run: bash scripts/build-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/loaf-release"
      - name: Rehearse an offline handoff with the release executable
        run: python3 python-package/tests/release_handoff.py "$RUNNER_TEMP/loaf-release/loaf"
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
      - name: Attach assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/loaf-release"
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$draft" = true ]; then
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./loaf LICENSE.txt ./*.whl ./*.tar.gz SHA256SUMS
            else
              echo "Release $GITHUB_REF_NAME is already published."
            fi
          else
            cd "$GITHUB_WORKSPACE"
            notes=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes "$notes" \
              "$RUNNER_TEMP/loaf-release/loaf" "$RUNNER_TEMP/loaf-release/LICENSE.txt" "$RUNNER_TEMP/loaf-release/"*.whl \
              "$RUNNER_TEMP/loaf-release/"*.tar.gz "$RUNNER_TEMP/loaf-release/SHA256SUMS"
          fi
