name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      RUN_DOCKER_TESTS: "0"
      RUN_GPU_TESTS: "0"
      RUN_TERMINAL_SERVER_TESTS: "0"
      RUN_CATALOG_TESTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the Docker-free suite
        run: |
          python -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install --editable ./python-package
          "$RUNNER_TEMP/test-venv/bin/loaf" test -v

      - name: Build and smoke-test the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" ./python-package
          python -m venv "$RUNNER_TEMP/wheel-venv"
          wheel_env="$RUNNER_TEMP/wheel-venv"
          "$wheel_env/bin/python" -m pip install --no-index --no-deps --find-links "$RUNNER_TEMP/wheels" local-ai-ferry
          (cd python-package && "$wheel_env/bin/python" -m unittest \
            tests.test_package.PackageTests.test_installed_package_contains_repository_license_files)
          mkdir "$RUNNER_TEMP/wheel-project"
          cd "$RUNNER_TEMP/wheel-project"
          "$wheel_env/bin/loaf" link-docker-project
          test -f docker-project/compose.yml
          test -f docker-project/docker/terminal-server/provisioner.py
          "$wheel_env/bin/loaf" download --dry-run
          "$wheel_env/bin/loaf" offline --cpu --dry-run
          "$wheel_env/bin/loaf" integration tether
